name: ARCHIVED - Rejected legacy Jin8 interpreter (do not distribute)

# Intentionally disabled for automatic builds: the v0.1/v0.2 interpreter
# crashed on Android, and the guarded follow-up exceeded its PRX footprint
# limit. The supported experiment lives in build-jin8-lite.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build separate PRX using PSPSDK
        run: |
          make -C plugin
          test -s plugin/Tekken6Jin8.prx
          # PSPDEV container has no Python; inspect ELF32 little-endian PHDR with coreutils.
          test "$(od -An -tu2 -j 44 -N 2 plugin/Tekken6Jin8.prx | tr -d '[:space:]')" = "1"
          memsz="$(od -An -tu4 -j 72 -N 4 plugin/Tekken6Jin8.prx | tr -d '[:space:]')"
          echo "Jin8 PRX mapped memory bytes: $memsz (v0.2 ceiling 9216)"
          test "$memsz" -lt 9216

      - name: Stage plugin shell (data is generated locally)
        run: |
          mkdir -p dist/PSP/PLUGINS/Tekken6Jin8
          cp plugin/Tekken6Jin8.prx dist/PSP/PLUGINS/Tekken6Jin8/
          cp plugin/config/plugin.ini dist/PSP/PLUGINS/Tekken6Jin8/
          cp plugin/INSTALL.md dist/INSTALL-READ-ME.md
      - uses: actions/upload-artifact@v4
        with:
          name: Tekken6Jin8-Experimental-PRX
          path: dist/
          if-no-files-found: error
