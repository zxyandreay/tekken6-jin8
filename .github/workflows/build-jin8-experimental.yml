name: Build experimental Jin8 PRX

on:
  push:
    paths:
      - 'plugin/**'
      - 'tools/build_jin8_resource.py'
      - '.github/workflows/build-jin8-experimental.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build separate PRX using PSPSDK
        run: |
          make -C plugin
          test -s plugin/Tekken6Jin8.prx
          python3 - <<'PY'
          import struct
          b = open('plugin/Tekken6Jin8.prx', 'rb').read()
          assert b[:4] == b'\x7fELF' and b[4] == 1 and b[5] == 1
          p_offset = struct.unpack_from('<I', b, 28)[0]
          p_count = struct.unpack_from('<H', b, 44)[0]
          assert p_count == 1
          p_filesz, p_memsz = struct.unpack_from('<II', b, p_offset + 16)
          print(f'PRX mapped file bytes={p_filesz:#x}, resident bytes={p_memsz:#x}')
          assert p_memsz < 0x2400, 'PRX footprint regression beyond v0.2 safety ceiling'
          PY
      - name: Stage plugin shell (data is generated locally)
        run: |
          mkdir -p dist/PSP/PLUGINS/Tekken6Jin8
          cp plugin/Tekken6Jin8.prx dist/PSP/PLUGINS/Tekken6Jin8/
          cp plugin/config/plugin.ini dist/PSP/PLUGINS/Tekken6Jin8/
          cp plugin/INSTALL.md dist/INSTALL-READ-ME.md
      - uses: actions/upload-artifact@v4
        with:
          name: Tekken6Jin8-Experimental-PRX
          path: dist/
          if-no-files-found: error
